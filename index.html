<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1ddc6">
<title>Film Sürprizi</title>
<meta name="description" content="Sana özel bir film seçtim...">
<style>
:root{--paper:#f7ebdb;--ink:#4b5338;--sage:#6f7352;--rose:#d98f8a;--lav:#a99cc7;--panel:rgba(251,243,230,.8)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(#ecd8c2,#f3e3d0);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
.scene{position:fixed;top:0;bottom:0;left:50%;width:min(100%,680px);transform:translateX(-50%);z-index:0;
  background:#f1ddc6 url("bg.jpg") center bottom/cover no-repeat;box-shadow:0 0 40px rgba(73,61,47,.14)}
main{position:relative;z-index:1;width:min(100%,480px);margin:0 auto;min-height:100vh;padding:clamp(1.5rem,8vh,4.5rem) 1.1rem 1.5rem;display:flex;flex-direction:column}
.brand{text-align:center;letter-spacing:.32em;font-size:.82rem;color:var(--sage);margin:0 0 1rem;text-transform:uppercase}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border:1px solid rgba(111,115,82,.2);border-radius:22px;padding:1.5rem 1.3rem;margin-bottom:1rem}
h1,h2{font-weight:400;font-style:italic;text-align:center;margin:0 0 .6rem;line-height:1.2}
h1{font-size:clamp(1.7rem,7vw,2.2rem)}h2{font-size:clamp(1.8rem,8vw,2.5rem)}
h3{font-weight:400;letter-spacing:.2em;font-size:.8rem;text-transform:uppercase;color:var(--sage);margin:0 0 .7rem;text-align:center}
.lead,.hint{text-align:center;margin:.4rem 0 1rem}
.hint{font-size:1rem}
.orn{display:flex;align-items:center;gap:.7rem;color:var(--sage);margin:.9rem 0}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:rgba(111,115,82,.45)}
.orn span{font-size:.7rem}
.msg{font-style:italic;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;margin:.2rem 0 .6rem}
label{display:block;font-size:.9rem;margin:.9rem 0 .3rem;color:var(--ink)}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.65);border:1px solid rgba(111,115,82,.4);border-radius:12px;padding:.7rem .85rem}
textarea{min-height:5.5rem;resize:vertical}
input::placeholder,textarea::placeholder{color:#9a9a85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:inherit;font-size:.88rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  color:#fbf3e6;background:var(--sage);border:1px solid var(--sage);border-radius:999px;padding:.85rem 1.6rem;box-shadow:inset 0 0 0 3px rgba(251,243,230,.18);transition:background .2s,transform .1s}
.btn:hover{background:#5d6144}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-color:rgba(111,115,82,.55)}
.btn.ghost:hover{background:rgba(111,115,82,.12)}
.btn.sm{padding:.5rem .9rem;font-size:.72rem;letter-spacing:.1em}
.btn.block{width:100%;margin-top:1.1rem}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.row .btn{flex:1 1 auto}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.err{color:#9b3b3b;font-size:.88rem;margin:.4rem 0 0;min-height:1.2em}
.arch{list-style:none;margin:0;padding:0}
.arch li{padding:.7rem 0;border-top:1px solid rgba(111,115,82,.25)}
.arch li:first-child{border-top:0}
.arch b{font-weight:400;font-size:1.05rem;overflow-wrap:anywhere}
.arch small{display:block;color:#7b7b66}
.arch .row{margin-top:.4rem}
.arch-wrap{max-height:22rem;overflow-y:auto;padding-right:.2rem}
details.old{margin-top:1rem;border-top:1px solid rgba(111,115,82,.25);padding-top:.8rem}
details.old summary{cursor:pointer;text-align:center;letter-spacing:.12em;font-size:.8rem;text-transform:uppercase;color:var(--sage)}
.empty{text-align:center;color:#7b7b66;margin:0}
.reveal-label{text-align:center;letter-spacing:.2em;font-size:.8rem;text-transform:uppercase;color:var(--sage);margin:0 0 .6rem}
.movie{margin:.2rem 0 1rem;outline:0;overflow-wrap:anywhere}
.movie .w{display:inline-block;white-space:nowrap;margin:0 .12em}
.movie .ch{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(12px);animation:rise 1s ease forwards;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{to{opacity:1;filter:blur(0);transform:none}}
.fade{animation:fade 1s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.petal{position:fixed;top:-20px;width:11px;height:14px;background:var(--rose);opacity:.75;border-radius:150% 0 150% 0;pointer-events:none;z-index:5;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:0}}
footer{margin-top:auto;padding-top:1rem;text-align:center;font-style:italic;font-size:.95rem;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fbf3e6;padding:.55rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.movie .ch{animation:none;opacity:1;filter:none;transform:none}.fade{animation:none}.petal{display:none}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<main>
  <noscript><div class="panel center">Bu site JavaScript gerektirir. Lütfen tarayıcınızda etkinleştirin.</div></noscript>
  <p class="brand">Film Sürprizi</p>

  <!-- Sürprizi hazırlayan kişinin ekranı -->
  <section id="viewCreate" hidden>
    <div class="panel">
      <form id="form" novalidate>
        <label for="film" class="sr">Film adı</label>
        <input id="film" maxlength="120" autocomplete="off" placeholder="Film adı">
        <p class="err" id="err" role="alert"></p>
        <label for="mesaj" class="sr">Mesaj</label>
        <textarea id="mesaj" maxlength="500" placeholder="Mesaj (isteğe bağlı)"></textarea>
        <button class="btn block" type="submit">Sürprizi oluştur</button>
      </form>
    </div>

    <div class="panel fade" id="result" hidden>
      <h3>Hazır</h3>
      <input id="link" readonly aria-label="Paylaşım bağlantısı">
      <div class="row">
        <button class="btn sm" type="button" id="copyBtn">Kopyala</button>
        <a class="btn sm ghost" id="waBtn" target="_blank" rel="noopener">WhatsApp</a>
        <button class="btn sm ghost" type="button" id="prevBtn">Önizle</button>
        <button class="btn sm ghost" type="button" id="newBtn">Yeni sürpriz</button>
      </div>
    </div>

    <div class="panel">
      <h3>Son sürprizler</h3>
      <div class="arch-wrap"><ul class="arch" id="archive"></ul></div>
      <p class="empty" id="archEmpty">Henüz yok.</p>
      <details class="old" id="oldBox">
        <summary>Eski filmleri ekle</summary>
        <form id="oldForm" novalidate>
          <label for="oldFilms">Filmler <span style="opacity:.7">(satır başına bir)</span></label>
          <textarea id="oldFilms" maxlength="3000" placeholder="Amélie&#10;Before Sunrise&#10;Lost in Translation"></textarea>
          <label for="oldDate">Tarih <span style="opacity:.7">(isteğe bağlı)</span></label>
          <input id="oldDate" type="date">
          <p class="err" id="oldErr" role="alert"></p>
          <button class="btn sm block" type="submit">Arşive ekle</button>
        </form>
      </details>
    </div>
  </section>

  <!-- Bağlantıyı açan kişinin ekranı -->
  <section id="viewSurprise" hidden>
    <div class="panel center">
      <div id="intro">
        <h2>Sana özel<br>bir film seçtim...</h2>
        <p class="msg" id="msg" hidden></p>
        <div class="orn" aria-hidden="true"><span>✦</span></div>
        <button class="btn" type="button" id="openBtn">Sürprizi aç</button>
      </div>
      <div id="reveal" hidden>
        <p class="reveal-label">Film</p>
        <h2 class="movie" id="movie" tabindex="-1" aria-live="polite"></h2>
        <div class="orn" aria-hidden="true"><span>✦</span></div>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn sm ghost" type="button" id="backBtn" hidden>← Düzenlemeye dön</button>
        <button class="btn sm ghost" type="button" id="mineBtn" hidden>Sen de bir sürpriz hazırla</button>
      </div>
    </div>
  </section>

  <footer>İyi filmler &bull; İyi anlar</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var KEY='filmSurprizi.arsiv', MAX=200;
  var current=null, lastLink='', preview=false;

  /* ---- Kodlama: #s= Base64 (UTF-8 + JSON), URL güvenli ---- */
  function enc(o){
    var b=new TextEncoder().encode(JSON.stringify(o)),s='';
    for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function dec(t){
    try{
      try{t=decodeURIComponent(t)}catch(e){}
      t=t.replace(/-/g,'+').replace(/_/g,'/');
      while(t.length%4)t+='=';
      var bin=atob(t),u=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      var txt=new TextDecoder().decode(u),o;
      try{o=JSON.parse(txt)}catch(e){return txt.trim()?{film:txt.trim(),msg:''}:null}
      if(typeof o==='string')return {film:o,msg:''};
      var f=o.f||o.film||o.movie||o.title||o.filmAdi||o.name||'';
      var m=o.m||o.message||o.mesaj||o.note||'';
      return f?{film:String(f),msg:String(m||'')}:null;
    }catch(e){return null}
  }
  function makeLink(film,msg){
    return location.origin+location.pathname+'#s='+enc({f:film,m:msg});
  }

  /* ---- Yardımcılar ---- */
  var toastT;
  function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on')},2200)}
  function copy(text){
    function fallback(){
      var i=document.createElement('input');i.value=text;i.style.position='fixed';i.style.opacity='0';
      document.body.appendChild(i);i.select();i.setSelectionRange(0,99999);
      var ok=false;try{ok=document.execCommand('copy')}catch(e){}
      document.body.removeChild(i);toast(ok?'Bağlantı kopyalandı':'Kopyalanamadı, bağlantıyı elle seç');
    }
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){toast('Bağlantı kopyalandı')},fallback);
    }else fallback();
  }
  function load(){try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
  function save(a){try{localStorage.setItem(KEY,JSON.stringify(a.slice(0,MAX)))}catch(e){}}

  /* ---- Ekranlar ---- */
  function show(which){
    $('viewCreate').hidden=which!=='create';
    $('viewSurprise').hidden=which!=='surprise';
    window.scrollTo(0,0);
  }
  function showCreate(){current=null;preview=false;show('create');renderArchive()}
  function showSurprise(data,isPreview){
    current=data;preview=!!isPreview;
    $('intro').hidden=false;$('reveal').hidden=true;$('movie').textContent='';
    var m=$('msg');m.textContent=data.msg||'';m.hidden=!data.msg;
    $('backBtn').hidden=!preview;$('mineBtn').hidden=true;
    show('surprise');$('openBtn').focus({preventScroll:true});
  }
  function route(){
    var h=location.hash.match(/^#s=(.+)$/);
    if(h){var d=dec(h[1]);if(d){showSurprise(d,false);return}}
    showCreate();
    if(h)toast('Bu bağlantı okunamadı');
  }

  /* ---- Sürprizi açma animasyonu ---- */
  function reveal(){
    if(!current)return;
    var mv=$('movie');mv.textContent='';var i=0;
    current.film.split(/\s+/).forEach(function(word){
      var w=document.createElement('span');w.className='w';
      Array.from(word).forEach(function(c){
        var s=document.createElement('span');s.className='ch';s.style.setProperty('--i',i++);s.textContent=c;w.appendChild(s);
      });
      mv.appendChild(w);mv.appendChild(document.createTextNode(' '));
    });
    $('intro').hidden=true;$('reveal').hidden=false;$('mineBtn').hidden=preview;mv.focus({preventScroll:true});
    petals();
  }
  function petals(){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    for(var i=0;i<16;i++){
      var p=document.createElement('span');p.className='petal';
      p.style.left=(Math.random()*100)+'vw';
      p.style.setProperty('--dx',(Math.random()*120-60)+'px');
      p.style.animationDuration=(6+Math.random()*4)+'s';
      p.style.animationDelay=(Math.random()*2.5)+'s';
      document.body.appendChild(p);
      (function(el){setTimeout(function(){el.remove()},11000)})(p);
    }
  }

  /* ---- Arşiv ---- */
  function renderArchive(){
    var a=load(),ul=$('archive');ul.textContent='';
    $('archEmpty').hidden=a.length>0;
    a.forEach(function(it,idx){
      var li=document.createElement('li'),b=document.createElement('b'),sm=document.createElement('small'),row=document.createElement('div');
      b.textContent=it.f;
      sm.textContent=new Date(it.t).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
      row.className='row';
      function btn(label,fn){var x=document.createElement('button');x.type='button';x.className='btn sm ghost';x.textContent=label;x.setAttribute('aria-label',label+': '+it.f);x.addEventListener('click',fn);row.appendChild(x)}
      btn('Kopyala',function(){copy(makeLink(it.f,it.m))});
      btn('Önizle',function(){showSurprise({film:it.f,msg:it.m||''},true)});
      btn('Sil',function(){var l=load();l.splice(idx,1);save(l);renderArchive()});
      li.appendChild(b);li.appendChild(sm);li.appendChild(row);ul.appendChild(li);
    });
  }

  /* ---- Eski filmleri arşive ekleme ---- */
  $('oldForm').addEventListener('submit',function(e){
    e.preventDefault();
    var lines=$('oldFilms').value.split(/\r?\n/).map(function(x){return x.trim().slice(0,120)}).filter(Boolean);
    if(!lines.length){$('oldErr').textContent='Film adı gerekli.';return}
    var d=$('oldDate').value,base=d?new Date(d+'T12:00:00').getTime():Date.now();
    var a=load();
    lines.forEach(function(f,i){a.push({f:f,m:'',t:base-i})});
    a.sort(function(x,y){return y.t-x.t});
    save(a);renderArchive();
    $('oldErr').textContent='';$('oldForm').reset();$('oldBox').open=false;
    toast(lines.length+' film arşive eklendi');
  });

  /* ---- Olaylar ---- */
  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var film=$('film').value.trim(),msg=$('mesaj').value.trim();
    if(!film){$('err').textContent='Film adı gerekli.';$('film').focus();return}
    $('err').textContent='';
    lastLink=makeLink(film,msg);
    $('link').value=lastLink;
    $('waBtn').href='https://wa.me/?text='+encodeURIComponent('Sana özel bir film seçtim: '+lastLink);
    $('result').hidden=false;
    var a=load();a.unshift({f:film,m:msg,t:Date.now()});save(a);renderArchive();
    $('result').scrollIntoView({behavior:'smooth',block:'center'});
  });
  $('copyBtn').addEventListener('click',function(){copy($('link').value)});
  $('link').addEventListener('focus',function(){this.select()});
  $('prevBtn').addEventListener('click',function(){showSurprise({film:$('film').value.trim(),msg:$('mesaj').value.trim()},true)});
  $('newBtn').addEventListener('click',function(){$('form').reset();$('result').hidden=true;$('err').textContent='';$('film').focus()});
  $('openBtn').addEventListener('click',reveal);
  $('backBtn').addEventListener('click',function(){show('create')});
  $('mineBtn').addEventListener('click',function(){history.pushState('',document.title,location.pathname+location.search);showCreate()});
  window.addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>
